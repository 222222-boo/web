<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>九九乘法表</title>
    <title>資訊三甲 邱景揚</title>
    <!-- CSS -->
    <style>
        /* 建立儲存格與表格樣式 */
        table {
            border-collapse: collapse;
            margin: 20px auto;
        }
        td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <!-- JavaScript -->
    <script>
        /* 將乘法表中的每個元素都放置入儲存格 */
        document.write("<table align='center'>");
        for (let i = 1; i <= 9; i++) {
            document.write("<tr>");
            for (let j = 1; j <= i; j++) {
                document.write("<td>");
                document.write(j + " * " + i + " = " + (i * j));
                document.write("</td>");
            }
            document.write("</tr>");
        }
        document.write("</table>");
    </script>

</body>
</html>
